<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация - PasteBin</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" rel="stylesheet" />
    <link rel="stylesheet" href="/css/registration.css" />
</head>
<body>
<!-- Верхняя панель -->
<header class="top-bar">
    <div class="top-bar-content">
        <a href="/" class="logo-link">
            <div class="logo">
                <img src="/images/image-2-4.png" class="logo-icon" alt="PasteBin" />
                <span class="logo-text">PasteBin</span>
            </div>
        </a>

        <div class="search-container">
            <span class="material-symbols-outlined search-icon">search</span>
            <input class="search-input" type="text" placeholder="Поиск..." />
        </div>

        <div class="header-actions">
            <span class="material-symbols-outlined">refresh</span>
<!--            <span class="material-symbols-outlined">view_list</span>-->
            <div class="profile-wrapper">
                <span class="material-symbols-outlined" id="profileBtn">account_circle</span>
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="#" id="profileLogin">Войти</a>
                    <a href="#" id="profileRegister">Зарегистрироваться</a>
                    <a href="#" id="profileLogout" style="display:none;">Выйти</a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Форма регистрации -->
<main class="main-content">
    <div class="auth-container">
        <div class="auth-box">
            <h2>Регистрация</h2>

            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="regUsername" placeholder="Логин" required />
                </div>

                <div class="form-group">
                    <input type="email" id="regEmail" placeholder="Email" required />
                </div>

                <div class="form-group">
                    <input type="password" id="regPassword" placeholder="Пароль" required />
                </div>

                <div class="form-group">
                    <input type="password" id="regPassword2" placeholder="Еще раз" required />
                </div>

                <button type="submit" class="auth-btn">Продолжить</button>

                <!--                <p class="auth-switch">-->
                <!--                    Нет аккаунта? <a href="/register">Зарегистрироваться</a>-->
                <!--                </p>-->
            </form>

            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>
</main>

<script src="/js/registration.js"></script>
</body>
</html>
