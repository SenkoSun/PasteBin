<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PasteBin</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<!-- Верхняя панель -->
<header class="top-bar">
    <div class="top-bar-content">
        <a href="/" class="logo-link">
            <div class="logo">
                <img src="/images/image-2-4.png" class="logo-icon" alt="PasteBin" />
                <span class="logo-text">PasteBin</span>
            </div>
        </a>

        <div class="search-container">
            <span class="material-symbols-outlined search-icon">search</span>
            <input class="search-input" type="text" placeholder="Поиск..."/>
        </div>

        <div class="header-actions">
            <span class="material-symbols-outlined" id="refreshBtn">refresh</span>
            <span class="material-symbols-outlined">view_list</span>
            <div class="profile-wrapper">
                <span class="material-symbols-outlined" id="profileBtn">account_circle</span>
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="#" id="profileLogin">Войти</a>
                    <a href="#" id="profileRegister">Зарегистрироваться</a>
                    <a href="#" id="profileLogout" style="display:none;">Выйти</a>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Основной контент -->
<main class="main-content">
    <!-- Поле для создания заметок -->
    <!-- Поле для создания заметок -->
    <div class="note-creator-wrapper" id="noteCreatorWrapper">

        <!-- Плейсхолдер (то, что видно в свернутом виде) -->
        <div class="creator-placeholder" id="creatorPlaceholder">
            <span class="material-symbols-outlined">sticky_note_2</span>
            <span>Заметка...</span>
        </div>

        <!-- Форма (скрыта до клика) -->
        <div class="note-form" id="noteForm">
            <input type="text" placeholder="Название..." id="noteTitleInput"  maxlength="50"/>
            <textarea placeholder="Текст заметки..." id="noteContentInput" rows="12" maxlength="1000"></textarea>

            <div class="note-form-actions">
                <button class="close-btn" id="closeFormBtn">Закрыть</button>
                <div class="ttl-wrapper" tabindex="0">
                    <input type="number" class="ttl-input" id="ttlInput" value="" min="1" max="1440" placeholder="60">
                    <span class="ttl-label">Мин</span>
                </div>
                <button class="save-btn" id="saveNoteBtn">Сохранить</button>
            </div>
        </div>

    </div>

    <!-- Сетка карточек -->
    <div class="notes-grid" id="notesGrid">
        <!-- Карточки будут добавляться через JavaScript -->
    </div>

    <!-- не авторизован -->
    <div class="empty-state" id="emptyStateGuest">
        <div class="material-symbols-outlined icon-unlogin"></div>
        <p>Войдите, чтобы создавать заметки</p>
    </div>

    <!-- авторизован -->
    <div class="empty-state" id="emptyStateUser" style="display:none;">
        <div class="material-symbols-outlined icon-login"></div>
        <p>Здесь будут ваши заметки</p>
    </div>

    <!-- окно для редактирования -->
    <div class="modal-overlay" id="noteModalOverlay">
        <div class="modal-window" id="noteModalWindow">
            <div class="modal-header">
                <input type="text" id="modalTitleInput" class="modal-title-input" maxlength="50" placeholder="Название...">
<!--                <button class="modal-icon-btn pin-btn"><span class="material-symbols-outlined">push_pin</span></button>-->
                <div class="modal-slug" id="modalSlug" ></div>
            </div>

            <div class="modal-body">
                <textarea id="modalContentInput" class="modal-content-textarea" placeholder="Текст заметки..." maxlength="1000"></textarea>
            </div>

            <div class="modal-footer">
                <div class="modal-actions">
                    <button class="modal-close-btn" id="modalCloseBtn">Закрыть</button>
                    <div class="modal-ttl" tabindex="0">
                        <input type="number" class="modal-ttl-input" id="modalTtlInput" value="" min="1" max="1440" placeholder="0">
                        <span class="modal-ttl-label">Мин</span>
                    </div>
                    <button class="modal-share-btn" id="modalShareBtn">Поделиться</button>
                    <button class="modal-save-btn" id="modalSaveBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>










</main>

<script src="/js/script.js"></script>
</body>
</html>
